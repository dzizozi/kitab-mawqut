name: Build & release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: cmd
        run: |
          set APP_VERSION=%GITHUB_REF_NAME:v=%
          if "%GITHUB_REF_TYPE%" NEQ "tag" set APP_VERSION=0.0.0-dev
          call build.cmd
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build .app + .dmg
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build tar.gz
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt "pywebview[qt]" pyinstaller
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.tar.gz }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
