name: Build & release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: cmd
        run: |
          set APP_VERSION=%GITHUB_REF_NAME:v=%
          if "%GITHUB_REF_TYPE%" NEQ "tag" set APP_VERSION=0.0.0-dev
          call build.cmd
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build .app + .dmg
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build tar.gz
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt "pywebview[qt]" pyinstaller
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.tar.gz }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build APK + AAB
        env:
          KEYSTORE_B64: ${{ secrets.ALKITAB_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ALKITAB_KEY_PASSWORD }}
        run: |
          pip install -r requirements.txt
          python tools/export_web.py
          cd android-app
          npm ci
          node scripts/copy-libs.mjs
          npx cap sync android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=alkitab\nkeyPassword=%s\n" "$RUNNER_TEMP/release.jks" "$KEY_PASSWORD" "$KEY_PASSWORD" > $RUNNER_TEMP/signing.properties
            export ALKITAB_SIGNING=$RUNNER_TEMP/signing.properties
          fi
          cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon -q
          V=${GITHUB_REF_NAME#v}
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/AlKitabAlMawqut-$V-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../dist/AlKitabAlMawqut-$V-android-playstore.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: android-playstore-bundle, path: dist/*.aab }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true, pattern: '{windows,macos,linux,android}' }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
