<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كتابا موقوتا</title>
<style>
@font-face{font-family:'Noto Kufi Arabic';src:url('fonts/NotoKufiArabic-Regular.ttf');font-weight:400}
@font-face{font-family:'Noto Kufi Arabic';src:url('fonts/NotoKufiArabic-Bold.ttf');font-weight:700 800}
@font-face{font-family:'Amiri';src:url('fonts/Amiri-Regular.ttf');font-weight:400}
@font-face{font-family:'Amiri';src:url('fonts/Amiri-Bold.ttf');font-weight:700}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Regular.ttf');font-weight:400}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Bold.ttf');font-weight:700}
@font-face{font-family:'UILatin';src:url('fonts/NotoSans-Regular.ttf');font-weight:400}
@font-face{font-family:'UILatin';src:url('fonts/NotoSans-Bold.ttf');font-weight:600 800}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body { font-family: var(--font); background: var(--bg); color: var(--fg); overflow: hidden; user-select: none;
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top) }
header { padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px }
header h1 { font-size: 19px; font-weight: 800; color: var(--accent); flex: 1 }
header .mo { font-size: 11.5px; text-align: left; line-height: 1.5; opacity: .85 } header .mo b { color: var(--accent) }
main { flex: 1; overflow-y: auto; padding: 0 12px 12px }
.tab { display: none } .tab.on { display: block }
.panel { background: var(--panel); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  backdrop-filter: var(--blur); padding: 14px; margin-bottom: 12px }
h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--accent) }
label { display: block; font-size: 12px; margin: 9px 0 4px; opacity: .8 }
select, input[type=text], input[type=number], input[type=search] { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
  color: var(--fg); background: var(--field); border: var(--fborder); border-radius: calc(var(--radius) * .5); outline: none }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font: inherit; font-weight: 700; font-size: 15px;
  padding: 12px; cursor: pointer; border: var(--bborder); border-radius: var(--bradius); background: var(--btn); color: var(--btnfg); box-shadow: var(--bshadow) }
.btn:active { transform: translateY(2px) } .btn.sec { background: var(--btn2); color: var(--btn2fg) }
.row { display: flex; gap: 8px; align-items: end } .row > * { flex: 1 }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0 }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); flex: none }
.note { font-size: 12px; line-height: 1.7; opacity: .85 }
.sheetbox { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,.2); background: #fff; margin-bottom: 12px }
.sheetbox iframe { position: absolute; top: 0; right: 0; width: 794px; height: 1123px; border: 0; transform-origin: top right }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.th { padding: 6px; border-radius: 14px; border: 2px solid transparent; text-align: center }
.th.on { border-color: var(--accent); background: var(--sel) }
.th .mini { position: relative; overflow: hidden; aspect-ratio: 794/1123; border-radius: 8px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15) }
.th iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none }
.th span { display: block; font-size: 13px; font-weight: 700; margin-top: 6px } .th small { font-size: 10.5px; opacity: .6 }
.tune { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px } .tune label { margin: 0 0 2px; text-align: center }
details summary { font-size: 13px; font-weight: 700; margin-top: 12px }
.citylist { max-height: 220px; overflow-y: auto; margin-top: 4px; border-radius: 10px; background: var(--field) }
.citylist div { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,.06) } .citylist div small { opacity: .6; margin-right: 6px }
.imgrow { display: flex; gap: 10px; align-items: center; margin-top: 8px }
.ph { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: var(--field); flex: none; display: grid; place-items: center; font-size: 22px }
.ph img { width: 100%; height: 100%; object-fit: cover }
nav { display: flex; background: var(--panel); border-top: var(--border); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: var(--blur) }
nav button { flex: 1; font: inherit; font-size: 12px; font-weight: 700; padding: 8px 0 10px; border: 0; background: none; color: var(--fg); opacity: .6 }
nav button svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8 }
nav button.on { opacity: 1; color: var(--accent) }
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--btn); color: var(--btnfg); padding: 10px 20px;
  border-radius: 24px; font-size: 13.5px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 9; max-width: 88% }
#toast.on { opacity: 1 }
.hide { display: none !important }

body[data-theme=glass] { --font: 'Noto Kufi Arabic', 'UILatin', sans-serif; --bg: linear-gradient(140deg,#cdeee3,#dfe5fb 50%,#f8e7cf); --fg: #17324a;
  --panel: rgba(255,255,255,.5); --border: 1px solid rgba(255,255,255,.8); --radius: 20px; --shadow: 0 8px 26px rgba(30,70,100,.14);
  --blur: blur(14px); --accent: #0f5e4f; --field: rgba(255,255,255,.65); --fborder: 1px solid rgba(255,255,255,.9);
  --btn: linear-gradient(180deg,#14806a,#0d5c4e); --btnfg: #fff; --bborder: 0; --bradius: 14px; --bshadow: 0 6px 16px rgba(13,92,78,.3);
  --btn2: rgba(255,255,255,.7); --btn2fg: #0f5e4f; --sel: rgba(255,255,255,.55) }
body[data-theme=brutal] { --font: 'Noto Kufi Arabic', 'UILatin', sans-serif; --bg: #fff4d6; --fg: #000; --panel: #fff; --border: 3px solid #000; --radius: 10px;
  --shadow: 5px 5px 0 #000; --blur: none; --accent: #000; --field: #fff; --fborder: 2px solid #000; --btn: #a3e635; --btnfg: #000;
  --bborder: 3px solid #000; --bradius: 8px; --bshadow: 4px 4px 0 #000; --btn2: #ff90e8; --btn2fg: #000; --sel: #ffd43b }
body[data-theme=bento] { --font: 'UILatin', 'Noto Sans Arabic', sans-serif; --bg: #eceef2; --fg: #1c1c1e; --panel: #fff; --border: 0; --radius: 22px;
  --shadow: 0 1px 2px rgba(0,0,0,.05); --blur: none; --accent: #0f766e; --field: #f2f2f7; --fborder: 1px solid #f2f2f7; --btn: #1c1c1e; --btnfg: #fff;
  --bborder: 0; --bradius: 16px; --bshadow: none; --btn2: #fde68a; --btn2fg: #1c1c1e; --sel: #fff }
body[data-theme=swiss] { --font: 'UILatin', 'Noto Sans Arabic', sans-serif; --bg: #fff; --fg: #111; --panel: #fff; --border: 0; --radius: 0;
  --shadow: none; --blur: none; --accent: #e30613; --field: #fff; --fborder: 1px solid #111; --btn: #111; --btnfg: #fff; --bborder: 0;
  --bradius: 0; --bshadow: none; --btn2: #e30613; --btn2fg: #fff; --sel: #f3f3f3 }
body[data-theme=swiss] .panel { border-top: 5px solid #111 }
body[data-theme=clay] { --font: 'Noto Kufi Arabic', 'UILatin', sans-serif; --bg: linear-gradient(160deg,#efe6ff,#ffe9f3 60%,#e3f6ff); --fg: #3b2f5c;
  --panel: #fbf8ff; --border: 0; --radius: 28px; --shadow: 10px 10px 22px rgba(126,96,191,.2), inset -5px -5px 12px rgba(126,96,191,.1), inset 5px 5px 12px #fff;
  --blur: none; --accent: #6d4bd1; --field: #fff; --fborder: 1px solid #efe8ff; --btn: #a78bfa; --btnfg: #fff; --bborder: 0; --bradius: 22px;
  --bshadow: 5px 5px 12px rgba(109,75,209,.35), inset -3px -3px 7px rgba(70,30,160,.3), inset 3px 3px 7px rgba(255,255,255,.45);
  --btn2: #ffb4d2; --btn2fg: #7a1f4a; --sel: #fff }
body[data-theme=skeuo] { --font: 'Amiri', serif; --bg: radial-gradient(circle at 30% 20%,#f7ecd2,#e9d6ad 60%,#cdb07a); --fg: #3b2a14;
  --panel: linear-gradient(#fffaf0,#f3e5c6); --border: 1px solid #b89a63; --radius: 10px; --shadow: 0 5px 12px rgba(70,40,10,.3), 0 0 0 3px #8b5e2b;
  --blur: none; --accent: #7a1f1f; --field: linear-gradient(#fff,#f6eedb); --fborder: 1px solid #b89a63; --btn: linear-gradient(#9b2b31,#5a1418);
  --btnfg: #fff8e6; --bborder: 1px solid #3a0a0d; --bradius: 8px; --bshadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.4);
  --btn2: linear-gradient(#f5d98b,#c9973f); --btn2fg: #3b2a14; --sel: rgba(212,168,74,.3) }
body[data-theme=material] { --font: 'UILatin', 'Noto Sans Arabic', sans-serif; --bg: #f4fbf8; --fg: #1d1b20; --panel: #fff; --border: 0; --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 8px 3px rgba(0,0,0,.06); --blur: none; --accent: #006a60; --field: #eef5f3;
  --fborder: 1px solid #eef5f3; --btn: #006a60; --btnfg: #fff; --bborder: 0; --bradius: 20px; --bshadow: 0 1px 3px rgba(0,0,0,.3);
  --btn2: #cce8e3; --btn2fg: #00201c; --sel: #cce8e3 }
body[data-theme=y2k] { --font: 'Noto Kufi Arabic', 'UILatin', sans-serif; --bg: linear-gradient(135deg,#c9f4ff,#f4c6ff 35%,#fff2a8 65%,#b6ffd9); --fg: #2a0a4a;
  --panel: linear-gradient(180deg,rgba(255,255,255,.92),rgba(230,236,255,.85)); --border: 3px solid #c0c7d6; --radius: 24px;
  --shadow: 0 0 0 2px #fff inset, 0 8px 22px rgba(122,0,255,.22); --blur: none; --accent: #7a00ff; --field: #fff; --fborder: 2px solid #c0c7d6;
  --btn: linear-gradient(180deg,#ff8be1,#ff2fb8 50%,#c4008c); --btnfg: #fff; --bborder: 2px solid #fff; --bradius: 30px;
  --bshadow: 0 4px 12px rgba(255,47,184,.45); --btn2: linear-gradient(180deg,#9be7ff,#00b7ff); --btn2fg: #fff; --sel: rgba(255,255,255,.7) }
</style></head>
<body data-theme="glass">
<header><h1>كتابا موقوتا</h1><div class="mo" id="month"></div></header>
<main>
 <section class="tab on" id="t-sheet">
  <div class="sheetbox" id="sheetbox"><iframe id="sheet"></iframe></div>
  <button class="btn" id="b-print">🖨️ طباعة / حفظ PDF</button>
  <p class="note" style="margin-top:10px">تُفتح نافذة الطباعة في الهاتف: اختر الطابعة، أو «حفظ كملف PDF» ثم شاركه عبر واتساب أو البريد.</p>
 </section>
 <section class="tab" id="t-design"><div class="gallery" id="gallery"></div></section>
 <section class="tab" id="t-settings">
  <div class="panel"><h2>البلد والمدينة</h2>
   <label>البلد</label><select id="country"></select>
   <label>المدينة</label><input type="search" id="citysearch" placeholder="اكتب للبحث…" autocomplete="off">
   <div class="citylist hide" id="citylist"></div>
   <div class="note" id="citycur" style="margin-top:6px"></div>
  </div>
  <div class="panel"><h2>طريقة الحساب والتقويم</h2>
   <label>طريقة حساب الأوقات</label><select id="method"></select>
   <label>حساب العصر</label><select id="asr"><option value="1">الجمهور (شافعي، مالكي، حنبلي)</option><option value="2">حنفي</option></select>
   <div class="row"><div><label>بداية الشهر الهجري</label><select id="hijri_mode"></select></div>
    <div style="flex:.5"><label>تعديل (يوم)</label><select id="hijri_adjust"><option value="-2">-2</option><option value="-1">-1</option><option value="0">0</option><option value="1">+1</option><option value="2">+2</option></select></div></div>
   <label class="switch" id="plus1row"><span>إضافة ساعة (+1) للتوقيت الرسمي GMT</span><input type="checkbox" id="morocco_plus1"></label>
   <details><summary>تعديل يدوي للأوقات بالدقائق</summary><div class="tune" id="tune" style="margin-top:8px"></div></details>
  </div>
  <div class="panel"><h2>المسجد والورقة</h2>
   <label>اسم المسجد (اختياري)</label><input type="text" id="mosque_name" placeholder="مثال: مسجد الحسن الثاني">
   <div class="imgrow"><div class="ph" id="ph">🕌</div>
    <button class="btn sec" style="width:auto;padding:9px 14px;font-size:13px" id="b-img">صورة المسجد / الشعار</button>
    <button class="btn sec" style="width:auto;padding:9px 14px;font-size:13px" id="b-imgdel">حذف</button>
    <input type="file" id="file" accept="image/*" class="hide"></div>
   <label>نص أو دعاء أعلى الورقة (اختياري)</label><input type="text" id="dua">
   <label>اللغة الثانية على الورقة</label><select id="lang2"><option value="fr">Français</option><option value="en">English</option></select>
  </div>
  <div class="panel"><h2>التذكير</h2>
   <label class="switch"><span>ذكّرني عند دخول كل شهر هجري لطباعة الورقة</span><input type="checkbox" id="reminder"></label>
   <p class="note">إشعار مساء اليوم السابق لبداية الشهر المتوقعة، وآخر صباح اليوم الأول.</p>
  </div>
  <p class="note" style="text-align:center;opacity:.6" id="ver"></p>
 </section>
</main>
<nav>
 <button class="on" data-t="sheet"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>الورقة</button>
 <button data-t="design"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-1.5 5-4a3 3 0 0 0-3-3c-2 0-2 2-2 3s0 2-1 4z"/><path d="M9 13l10-10 2 2-10 10"/></svg>التصميم</button>
 <button data-t="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 4.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg>الإعدادات</button>
</nav>
<div id="toast"></div>
<script src="lib/astronomy.browser.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
